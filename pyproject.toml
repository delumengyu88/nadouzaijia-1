[project]
name = "nadou"
version = "0.1.0"
description = "Backend for the 那豆在架 copyright-monitoring lookup service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "fastapi>=0.121",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pillow>=10",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.49",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nadou = ["static/admin/*", "fonts/*", "stop_words.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: integration tests that require DATABASE_URL pointing at Postgres",
    "browser: loads the workbench in a headless browser",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
