name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nadou
          POSTGRES_PASSWORD: nadou_dev_password
          POSTGRES_DB: nadou
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nadou -d nadou"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://nadou:nadou_dev_password@localhost:5432/nadou
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Pytest (sqlite)
        run: pytest -m "not postgres and not browser"
      - name: Migrate
        run: alembic upgrade head
      - name: Pytest (postgres)
        env:
          NADOU_REQUIRE_POSTGRES: "1"
        run: pytest -m postgres
      - name: Workbench browser
        env:
          NADOU_ALLOW_DEV_SEED: "1"
          NADOU_DATA_SOURCE: demo
          NADOU_RUN_BROWSER: "1"
        run: |
          python -m playwright install --with-deps chromium
          pytest -m browser

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start, restart, and start again from an empty volume
        run: |
          set -eu
          wait_ready() {
            i=0
            while [ "$i" -lt 60 ]; do
              if curl -fsS http://127.0.0.1:8000/healthz >/dev/null && curl -fsS http://127.0.0.1:8000/admin/ >/dev/null; then
                return 0
              fi
              i=$((i + 1))
              sleep 5
            done
            docker compose logs
            return 1
          }
          login() {
            curl -fsS -X POST http://127.0.0.1:8000/api/v1/admin/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"演示管理员","password":"demo-pass-2026"}' \
              | grep -q '"role":"admin"'
          }
          docker compose up --build -d
          wait_ready
          login
          docker compose up -d --force-recreate api
          wait_ready
          login
          docker compose down -v
          docker compose up -d
          wait_ready
          login
          docker compose down -v
      - name: Build the API image for arm64
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --name nadou-arm --use
          docker buildx build --platform linux/arm64 -t nadou:arm64 .
