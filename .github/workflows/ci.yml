name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nadou
          POSTGRES_PASSWORD: nadou_dev_password
          POSTGRES_DB: nadou
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nadou -d nadou"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://nadou:nadou_dev_password@localhost:5432/nadou
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Pytest (sqlite)
        run: pytest -m "not postgres"
      - name: Migrate
        run: alembic upgrade head
      - name: Pytest (postgres)
        env:
          NADOU_REQUIRE_POSTGRES: "1"
        run: pytest -m postgres
