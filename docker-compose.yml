services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nadou
      POSTGRES_PASSWORD: nadou_dev_password
      POSTGRES_DB: nadou
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nadou -d nadou"]
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://nadou:nadou_dev_password@db:5432/nadou
      APP_ENV: local
      NADOU_ALLOW_DEV_SEED: "1"
      NADOU_DATA_SOURCE: demo
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
